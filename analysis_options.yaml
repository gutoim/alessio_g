# Static analysis for the app: `flutter analyze`.
# Base rule set: package:flutter_lints (recommended lints for Flutter apps).
# Full list of lints: https://dart.dev/lints
include: package:flutter_lints/flutter.yaml

analyzer:
  # Generated files (*.g.dart, *.freezed.dart, injection.config.dart, l10n/gen)
  # are analyzed on purpose. Their generators already disable lints with
  # `ignore_for_file: type=lint`, and excluding them would also hide real
  # compile errors in generated code.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Async mistakes and leaked streams are real bugs, so they fail analysis.
    unawaited_futures: error
    cancel_subscriptions: error
    close_sinks: error

linter:
  rules:
    # Layering: package imports make cross-layer imports easy to spot,
    # e.g. a `package:dummy_shop/data/...` import inside presentation/.
    - always_use_package_imports

    # Correctness
    - avoid_dynamic_calls
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - unawaited_futures

    # Readability and consistency
    - always_declare_return_types
    - avoid_redundant_argument_values
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - type_annotate_public_apis
    - unnecessary_lambdas
